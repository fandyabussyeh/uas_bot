# Penjadwal 4 jam: menit ke-7 setelah penutupan candle 4H (UTC 00,04,08,12,16,20). Menit selain 0 agar tidak antre.
name: tick
on:
  schedule: [{ cron: '7 0,4,8,12,16,20 * * *' }, { cron: '22 0,4,8,12,16,20 * * *' }]   # cadangan menit ke-22 (idempotent: candle sama tidak diproses ulang)
  workflow_dispatch: {}
jobs:
  call:
    runs-on: ubuntu-latest
    steps:
      - name: Panggil /api/tick
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 120 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ secrets.TICK_URL }}" | tee tick.json
          jq -e '.status == "processed" or .status == "duplicate" or .status == "duplicate_lock" or .status == "killed"' tick.json
