<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bot Dry Run Indodax</title>
<style>body{font:14px system-ui;background:#0b0c0e;color:#e8eaee;margin:0;padding:16px;max-width:1000px;margin:auto}.k{display:inline-block;background:#15171b;border:1px solid #262a31;border-radius:10px;padding:10px 14px;margin:4px}.k b{display:block;font-size:20px}table{border-collapse:collapse;width:100%;font-size:12px}td,th{padding:4px 8px;border-bottom:1px solid #262a31;text-align:right}.mu{color:#8b919c}</style></head><body>
<h2>Bot Dry Run Indodax · status langsung</h2><div class="mu">Membaca log dari <code>/api/public</code>. Angka resmi untuk laporan dihitung oleh <code>scripts/hitung_ulang.mjs</code> dari log mentah.</div><div id="s">memuat…</div><h3>Panggilan terakhir</h3><table id="c"></table><h3>Order terakhir</h3><table id="o"></table>
<script>
fetch('/api/public').then(r=>r.json()).then(L=>{const c=L.calls,p=c.filter(x=>x.status==='processed'),eq=p.length?p[p.length-1].eq:1e8,pk=Math.max(1e8,...p.map(x=>x.eq));let dd=0,m=1e8;p.forEach(x=>{m=Math.max(m,x.eq);dd=Math.min(dd,x.eq/m-1)});
const pct=x=>(x*100).toFixed(2)+'%',k=(a,b)=>`<div class="k"><span class="mu">${a}</span><b>${b}</b></div>`;
document.getElementById('s').innerHTML=k('Ekuitas','Rp '+Math.round(eq).toLocaleString('id-ID'))+k('Return',pct(eq/1e8-1))+k('Max DD',pct(dd))+k('Panggilan',c.length)+k('Terproses',p.length)+k('Error',L.errors.length)+k('Kill switch',L.killswitch.length)+k('Posisi terbuka',Object.keys((L.state||{}).pos||{}).join(', ')||'tidak ada');
document.getElementById('c').innerHTML='<tr><th>Waktu</th><th>Status</th><th>Candle</th><th>Telat (dtk)</th><th>Ekuitas</th></tr>'+c.slice(-15).reverse().map(x=>`<tr><td>${x.ts}</td><td>${x.status}</td><td>${x.barT?new Date(x.barT*1000).toISOString().slice(0,16):''}</td><td>${x.lateSec??''}</td><td>${x.eq?Math.round(x.eq).toLocaleString('id-ID'):''}</td></tr>`).join('');
document.getElementById('o').innerHTML='<tr><th>Waktu</th><th>Pair</th><th>Sisi</th><th>Fill</th><th>Fee</th><th>Status</th></tr>'+L.orders.slice(-15).reverse().map(x=>`<tr><td>${x.ts}</td><td>${x.pair}</td><td>${x.side}</td><td>${x.fill?x.fill.toFixed(2):''}</td><td>${x.fee?Math.round(x.fee):''}</td><td>${x.status}</td></tr>`).join('')}).catch(e=>document.getElementById('s').textContent='gagal memuat: '+e);
</script></body></html>
